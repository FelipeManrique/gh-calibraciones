<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Calibraciones — GH Consultora</title>
<style>
  :root{ --brand-dark:#4a7a1e; --brand:#8dc63f; --ink:#2b2f26; --ink-soft:#5b6058; --bg:#f7f8f4; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .card{ max-width:440px; }
  .logo{ font-weight:800; font-size:40px; letter-spacing:-1px;
    background:linear-gradient(135deg, var(--brand-dark), var(--brand));
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px; }
  h1{ font-size:20px; margin:0 0 6px; }
  p{ color:var(--ink-soft); font-size:14px; line-height:1.5; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14170f; --ink:#eef0e8; --ink-soft:#a7ad9d; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">GH</div>
    <h1>Dashboard de Calibraciones</h1>
    <p>GH Consultora · Mediciones y Monitoreos<br><br>
    El acceso con inicio de sesión de Google está en construcción.<br>
    Esta URL va a quedar activa próximamente.</p>
  </div>
</body>
</html>
